<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Card Archive</title>
    <link rel="manifest" href="/Bib_new/manifest.json">
    <meta name="theme-color" content="#3a7d44">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="말씀카드">
    <link rel="apple-touch-icon" href="/Bib_new/icon-192.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        :root {
            --cream:#f4f8f4; --parchment:#e6f0e6; --green:#3a7d44; --green-pale:#c8e6c9;
            --ink:#1a2e1a; --ink-soft:#3d5c3d; --ink-faint:#7a9c7a;
            --border:#b2d0b2; --white:#ffffff; --red-soft:#c0392b;
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Noto Sans KR',sans-serif;background-color:var(--cream);min-height:100vh;color:var(--ink);}
        header{text-align:center;padding:32px 20px 20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--white) 0%,var(--cream) 100%);}
        header h1{font-family:'Noto Sans KR',sans-serif;font-size:1.5rem;font-weight:700;color:var(--green);letter-spacing:0.12em;text-transform:uppercase;}
        .container{max-width:720px;margin:0 auto;padding:24px 16px 60px;}
        .tabs{display:flex;margin-bottom:8px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--white);}
        .tab-btn{flex:1;padding:12px 8px;border:none;background:var(--white);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:0.82rem;font-weight:700;color:var(--ink-faint);transition:all 0.2s;border-right:1px solid var(--border);}
        .tab-btn:last-child{border-right:none;}
        .tab-btn:hover{background:var(--parchment);color:var(--ink);}
        .tab-btn.active{background:var(--green);color:var(--white);}
        .tab-hint{font-size:0.74rem;color:var(--ink-faint);margin-bottom:16px;padding-left:2px;}
        .panel{display:none;} .panel.active{display:block;}
        .card-box{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(58,125,68,0.07);}
        .testament-toggle{display:flex;margin-bottom:14px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
        .testament-btn{flex:1;padding:9px;border:none;background:var(--white);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:0.8rem;font-weight:700;color:var(--ink-faint);transition:all 0.2s;border-right:1px solid var(--border);}
        .testament-btn:last-child{border-right:none;}
        .testament-btn.active{background:var(--green-pale);color:var(--green);}
        .row{display:flex;gap:10px;margin-bottom:12px;} .row>*{flex:1;}
        select,input[type="number"],input[type="text"],textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:7px;background:var(--cream);font-family:'Noto Sans KR',sans-serif;font-size:0.85rem;color:var(--ink);outline:none;transition:border-color 0.2s;}
        select:focus,input:focus,textarea:focus{border-color:var(--green);background:var(--white);}
        input[type="number"]:disabled{opacity:0.4;cursor:not-allowed;}
        label{display:block;font-size:0.74rem;font-weight:500;color:var(--ink-faint);letter-spacing:0.05em;margin-bottom:5px;margin-top:14px;}
        label:first-child{margin-top:0;}
        textarea{resize:vertical;line-height:1.8;font-family:'Noto Serif KR',serif;}
        .verse-range-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px;}
        .verse-range-row>.verse-input{flex:1;}
        .whole-chapter-wrap{display:flex;align-items:center;gap:6px;padding-bottom:10px;white-space:nowrap;cursor:pointer;}
        .whole-chapter-wrap input[type="checkbox"]{width:16px;height:16px;accent-color:var(--green);cursor:pointer;}
        .whole-chapter-wrap span{font-size:0.78rem;font-weight:600;color:var(--ink-soft);}

        /* 키워드 태그 입력 */
        .keyword-wrap{position:relative;}
        .keyword-tags{display:flex;flex-wrap:wrap;gap:6px;min-height:38px;padding:6px 10px;border:1px solid var(--border);border-radius:7px;background:var(--cream);cursor:text;align-items:center;transition:border-color 0.2s;}
        .keyword-tags:focus-within{border-color:var(--green);background:var(--white);}
        .kw-tag{display:flex;align-items:center;gap:4px;padding:2px 8px;background:var(--green-pale);border-radius:12px;font-size:0.75rem;color:var(--green);font-weight:600;}
        .kw-tag button{background:none;border:none;cursor:pointer;color:var(--green);font-size:0.8rem;padding:0;line-height:1;}
        .kw-tag-input{border:none;background:transparent;outline:none;font-size:0.85rem;font-family:'Noto Sans KR',sans-serif;color:var(--ink);min-width:80px;flex:1;padding:2px 0;}
        .kw-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--white);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(58,125,68,0.12);z-index:100;max-height:180px;overflow-y:auto;}
        .kw-dropdown.show{display:block;}
        .kw-dropdown-item{padding:9px 14px;font-size:0.83rem;cursor:pointer;color:var(--ink-soft);font-family:'Noto Sans KR',sans-serif;transition:background 0.15s;display:flex;align-items:center;gap:8px;}
        .kw-dropdown-item:hover{background:var(--parchment);color:var(--green);}
        .kw-dropdown-item.selected::after{content:"✓";margin-left:auto;color:var(--green);font-weight:700;}
        .kw-dropdown-empty{padding:10px 14px;font-size:0.8rem;color:var(--ink-faint);}

        /* 성경 열람 - 검색 */
        .search-box{display:flex;gap:8px;margin-bottom:14px;}
        .search-box input{flex:1;}
        .btn-search{padding:10px 16px;border:none;background:var(--green);color:var(--white);border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:0.83rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:all 0.2s;}
        .btn-search:hover{background:#2e6335;}
        .search-mode-toggle{display:flex;margin-bottom:14px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
        .search-mode-btn{flex:1;padding:8px;border:none;background:var(--white);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:0.78rem;font-weight:700;color:var(--ink-faint);transition:all 0.2s;border-right:1px solid var(--border);}
        .search-mode-btn:last-child{border-right:none;}
        .search-mode-btn.active{background:var(--green-pale);color:var(--green);}

        /* 검색 결과 */
        .search-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
        .search-count{font-size:0.78rem;color:var(--ink-faint);font-weight:600;}
        .btn-back{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--white);color:var(--ink-soft);font-family:'Noto Sans KR',sans-serif;font-size:0.76rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
        .btn-back:hover{background:var(--parchment);color:var(--green);}
        .search-result-item{padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--white);margin-bottom:8px;cursor:pointer;transition:all 0.2s;}
        .search-result-item:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(58,125,68,0.1);}
        .search-result-ref{font-family:'Noto Sans KR',sans-serif;font-size:0.74rem;font-weight:700;color:var(--green);margin-bottom:4px;}
        .search-result-text{font-family:'Noto Serif KR',serif;font-size:0.85rem;line-height:1.7;color:var(--ink);}
        .search-result-text mark{background:#fff176;color:var(--ink);border-radius:2px;padding:0 1px;}
        .search-progress{text-align:center;padding:20px;color:var(--ink-faint);font-size:0.83rem;}
        .progress-bar-wrap{width:100%;height:4px;background:var(--parchment);border-radius:2px;margin-top:8px;overflow:hidden;}
        .progress-bar{height:100%;background:var(--green);border-radius:2px;transition:width 0.2s;}

        /* 본문 상세 뷰 */
        .verse-detail-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
        .verse-detail-ref{font-family:'Noto Sans KR',sans-serif;font-size:0.85rem;font-weight:700;color:var(--green);}

        /* Bible Viewer */
        #bibleViewer{margin-top:16px;max-height:380px;overflow-y:auto;padding-right:4px;}
        #bibleViewer::-webkit-scrollbar{width:4px;}
        #bibleViewer::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
/* 성경 열람 - 절 선택 카드 작성 */
        .verse-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--parchment);line-height:1.8;font-size:0.9rem;font-family:'Noto Serif KR',serif;cursor:pointer;transition:background 0.15s;border-radius:4px;}
        .verse-item:last-child{border-bottom:none;}
        .verse-item:hover{background:var(--parchment);}
        .verse-item.selected{background:var(--green-pale);}
        .verse-num{font-family:'Noto Sans KR',sans-serif;font-size:0.7rem;color:var(--green);font-weight:700;min-width:22px;padding-top:4px;}
        .verse-select-bar{display:none;position:sticky;bottom:0;background:var(--white);border-top:1px solid var(--border);padding:10px 0 4px;margin-top:8px;}
        .verse-select-bar.show{display:flex;gap:8px;align-items:center;justify-content:space-between;}
        .verse-select-info{font-size:0.78rem;color:var(--ink-soft);font-weight:600;font-family:'Noto Sans KR',sans-serif;}
        .btn-make-card{padding:8px 16px;border:none;background:var(--green);color:var(--white);border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
        .btn-make-card:hover{background:#2e6335;}
        .btn-clear-sel{padding:8px 12px;border:1px solid var(--border);background:var(--white);color:var(--ink-soft);border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
        .btn-clear-sel:hover{background:var(--parchment);}

        /* 카드 작성 임시저장 인디케이터 */
        .draft-indicator{display:none;font-size:0.72rem;color:var(--green);font-weight:600;font-family:'Noto Sans KR',sans-serif;padding:4px 10px;background:var(--green-pale);border-radius:12px;margin-bottom:12px;}
        .draft-indicator.show{display:inline-block;}

        .btn{display:block;width:100%;padding:13px;margin-top:16px;border:none;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
        .btn-primary{background:var(--green);color:var(--white);}
        .btn-primary:hover{background:#2e6335;}

        /* 보관함 필터 */
        .filter-section{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
        .filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
        .filter-label{font-size:0.73rem;font-weight:700;color:var(--ink-faint);white-space:nowrap;letter-spacing:0.04em;}
        .filter-badges{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
        .filter-divider{width:100%;height:1px;background:var(--border);margin:10px 0;}
        .badge{padding:4px 12px;border-radius:20px;font-size:0.75rem;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--ink-soft);transition:all 0.2s;font-weight:500;font-family:'Noto Sans KR',sans-serif;}
        .badge:hover{background:var(--parchment);color:var(--green);}
        .badge.active{background:var(--green);border-color:var(--green);color:var(--white);}

        /* 보관함 툴바 */
        .view-toolbar{display:flex;justify-content:flex-end;margin-bottom:12px;gap:8px;}
        .btn-toolbar{padding:7px 14px;border-radius:7px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;border:1px solid var(--border);transition:all 0.2s;white-space:nowrap;}
        .btn-delete-mode{background:var(--white);color:var(--red-soft);border-color:#f5c6c2;}
        .btn-delete-mode:hover{background:#fdf0ef;}
        .btn-delete-confirm{background:var(--red-soft);color:var(--white);border-color:var(--red-soft);display:none;}
        .btn-delete-confirm:hover{background:#a93226;}
        .btn-cancel-del{background:var(--white);color:var(--ink-soft);display:none;}
        .btn-cancel-del:hover{background:var(--parchment);}

        /* Word Card */
        .word-card{display:flex;gap:12px;align-items:flex-start;background:var(--white);border:1px solid var(--border);border-left:4px solid var(--green);border-radius:10px;padding:14px 20px;margin-bottom:14px;transition:box-shadow 0.2s;}
        .word-card:hover{box-shadow:0 4px 16px rgba(58,125,68,0.10);}
        .word-card.selected{border-color:var(--red-soft);border-left-color:var(--red-soft);background:#fff8f8;}
        .card-checkbox-wrap{display:none;align-items:center;padding-top:3px;flex-shrink:0;}
        .card-checkbox-wrap input[type="checkbox"]{width:17px;height:17px;accent-color:var(--red-soft);cursor:pointer;}
        .delete-mode .card-checkbox-wrap{display:flex;}
        .card-content{flex:1;min-width:0;}
        .word-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
        .header-left{flex:1;min-width:0;}
        .word-card-ref{font-family:'Noto Sans KR',sans-serif;font-size:0.74rem;font-weight:700;color:var(--green);letter-spacing:0.07em;margin-bottom:5px;}
        .card-kw-preview{display:flex;flex-wrap:wrap;gap:5px;}
        .kw-chip{padding:2px 8px;background:var(--parchment);border-radius:10px;font-size:0.7rem;color:var(--ink-soft);font-weight:500;font-family:'Noto Sans KR',sans-serif;}
        .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
        .card-date{font-family:'Noto Sans KR',sans-serif;font-size:0.7rem;color:var(--ink-faint);}
        .header-btns{display:flex;gap:5px;}
        .toggle-btn{background:none;border:1px solid var(--border);cursor:pointer;color:var(--ink-faint);font-size:0.7rem;font-family:'Noto Sans KR',sans-serif;font-weight:600;padding:3px 7px;border-radius:5px;transition:all 0.2s;white-space:nowrap;}
        .toggle-btn:hover{background:var(--parchment);color:var(--green);border-color:var(--green);}
        .toggle-btn.open{background:var(--green-pale);color:var(--green);border-color:var(--green);}
        .toggle-btn.hidden{display:none;}
        .word-card-text-wrap{overflow:hidden;max-height:0;opacity:0;transition:max-height 0.3s ease,opacity 0.3s ease,margin-top 0.3s ease;margin-top:0;}
        .word-card-text-wrap.open{max-height:2000px;opacity:1;margin-top:10px;}
        .word-card-text{font-family:'Noto Serif KR',serif;font-size:0.9rem;line-height:1.85;color:var(--ink);white-space:pre-wrap;padding:10px 12px;background:var(--cream);border-radius:7px;}
        .word-card-memo-wrap{overflow:hidden;max-height:2000px;opacity:1;transition:max-height 0.3s ease,opacity 0.3s ease,margin-top 0.3s ease;margin-top:10px;}
        .word-card-memo-wrap.closed{max-height:0;opacity:0;margin-top:0;}
        .word-card-memo{padding:10px 12px;background:var(--cream);border-radius:6px;font-family:'Noto Serif KR',serif;font-size:0.82rem;color:var(--ink-soft);line-height:1.7;white-space:pre-wrap;}
        .word-card-memo::before{content:"✦ ";color:var(--green);font-size:0.7rem;}
        .card-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
        .btn-edit{padding:5px 14px;border:1px solid var(--border);border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;background:var(--parchment);color:var(--ink-soft);transition:all 0.2s;}
        .btn-edit:hover{background:var(--green-pale);color:var(--green);}
        .edit-form{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
        .btn-save,.btn-cancel-edit{padding:5px 14px;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;border:1px solid var(--border);transition:all 0.2s;}
        .btn-save{background:var(--green);color:var(--white);border-color:var(--green);}
        .btn-save:hover{background:#2e6335;}
        .btn-cancel-edit{background:var(--white);color:var(--ink-soft);}
        .btn-cancel-edit:hover{background:var(--parchment);}
        .empty-state{text-align:center;padding:48px 0;color:var(--ink-faint);font-size:0.85rem;line-height:2;}
        .status-msg{text-align:center;padding:32px 0;color:var(--ink-faint);font-size:0.85rem;}
        .status-err{color:var(--red-soft);}

        /* 해시태그 */
        .tag-input-wrap{position:relative;}
        .chapter-tag-card{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--green);border-radius:10px;padding:14px 18px;margin-bottom:12px;}
        .chapter-tag-ref{font-family:'Noto Sans KR',sans-serif;font-size:0.78rem;font-weight:700;color:var(--green);margin-bottom:8px;}
        .chapter-tag-badges{display:flex;flex-wrap:wrap;gap:6px;}
        .chapter-tag-badge{padding:4px 11px;border-radius:20px;font-size:0.75rem;font-weight:600;background:var(--green-pale);color:var(--green);font-family:'Noto Sans KR',sans-serif;}
        .tag-empty{text-align:center;padding:40px 0;color:var(--ink-faint);font-size:0.85rem;line-height:2;}
        .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--white);padding:11px 24px;border-radius:24px;font-size:0.83rem;font-family:'Noto Sans KR',sans-serif;opacity:0;transition:all 0.3s;pointer-events:none;z-index:999;}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

        /* 하이라이트 */
        .hl-yellow{background:#fff176;border-radius:2px;padding:0 1px;}
        .hl-green{background:#b9f6ca;border-radius:2px;padding:0 1px;}
        .hl-pink{background:#ffc1cc;border-radius:2px;padding:0 1px;}

        /* 하이라이트 팝업 */
        .hl-popup{position:fixed;display:none;flex-direction:column;gap:6px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:1000;}
        .hl-popup.show{display:flex;}
        .hl-popup-title{font-size:0.72rem;font-weight:700;color:var(--ink-faint);font-family:'Noto Sans KR',sans-serif;margin-bottom:2px;}
        .hl-popup-btns{display:flex;gap:6px;align-items:center;}
        .hl-color-btn{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform 0.15s,border-color 0.15s;}
        .hl-color-btn:hover{transform:scale(1.15);border-color:var(--ink-faint);}
        .hl-color-btn.yellow{background:#fff176;}
        .hl-color-btn.green{background:#b9f6ca;}
        .hl-color-btn.pink{background:#ffc1cc;}
        .hl-remove-btn{font-size:0.72rem;font-weight:600;color:var(--red-soft);background:none;border:1px solid #f5c6c2;border-radius:5px;padding:3px 8px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s;}
        .hl-remove-btn:hover{background:#fdf0ef;}

        /* 본문 영역 - 하이라이트 가능 */
        #cardTextDisplay{font-family:'Noto Serif KR',serif;font-size:0.9rem;line-height:1.9;color:var(--ink);padding:10px 12px;background:var(--cream);border-radius:7px;min-height:80px;white-space:pre-wrap;cursor:text;user-select:text;-webkit-user-select:text;}
        .hl-hint{font-size:0.72rem;color:var(--ink-faint);margin-top:6px;padding-left:2px;}
    </style>
</head>
<body>

<header><h1>Word Card Archive</h1></header>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('read-panel', this)">📖 열람</button>
        <button class="tab-btn" onclick="switchTab('create-panel', this)">✍️ 생성</button>
        <button class="tab-btn" onclick="switchTab('tag-panel', this)">#️⃣ 태그</button>
        <button class="tab-btn" onclick="switchTab('view-panel', this)">🗂️ 보관함</button>
    </div>

    <!-- 성경 열람 -->
    <div id="read-panel" class="panel active">
        <p class="tab-hint">장별 열람 또는 키워드로 전체 성경을 검색할 수 있습니다.</p>
        <div class="card-box">
            <!-- 열람/검색 모드 토글 -->
            <div class="search-mode-toggle">
                <button class="search-mode-btn active" id="modeRead" onclick="switchReadMode('read')">📖 장별 열람</button>
                <button class="search-mode-btn" id="modeSearch" onclick="switchReadMode('search')">🔍 키워드 검색</button>
            </div>

            <!-- 장별 열람 -->
            <div id="readModeBox">
                <div class="testament-toggle">
                    <button class="testament-btn active" onclick="switchTestament('ot', this)">구약</button>
                    <button class="testament-btn" onclick="switchTestament('nt', this)">신약</button>
                </div>
                <div class="row">
                    <div><label>성경책</label><select id="readBook" onchange="updateChapters('readBook','readChapter'); loadBibleVerses();"></select></div>
                    <div><label>장</label><select id="readChapter" onchange="loadBibleVerses()"></select></div>
                </div>
                <div id="bibleViewer"><div class="status-msg">성경책과 장을 선택해 주세요.</div></div>
                <div class="verse-select-bar" id="verseSelectBar">
                    <span class="verse-select-info" id="verseSelectInfo">0절 선택됨</span>
                    <div style="display:flex;gap:6px;">
                        <button class="btn-clear-sel" onclick="clearVerseSelection()">선택 해제</button>
                        <button class="btn-make-card" onclick="makeCardFromSelection()">✍️ 카드 작성</button>
                    </div>
                </div>
            </div>

            <!-- 키워드 검색 -->
            <div id="searchModeBox" style="display:none;">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="검색어를 입력하세요" onkeydown="if(event.key==='Enter') doSearch()">
                    <button class="btn-search" onclick="doSearch()">검색</button>
                </div>
                <div id="searchResults"></div>
            </div>
        </div>
    </div>

    <!-- 카드 생성 -->
    <div id="create-panel" class="panel">
        <p class="tab-hint">말씀 범위를 선택하고 묵상을 기록해 카드로 저장하세요.</p>
        <div><span class="draft-indicator" id="draftIndicator">✏️ 작성 중인 카드가 있어요</span></div>
        <div class="card-box">
            <div class="testament-toggle">
                <button class="testament-btn active" onclick="switchTestamentCard('ot', this)">구약</button>
                <button class="testament-btn" onclick="switchTestamentCard('nt', this)">신약</button>
            </div>
            <div class="row">
                <div><label>성경책</label><select id="cardBook" onchange="updateChapters('cardBook','cardChapter');"></select></div>
                <div><label>장</label><select id="cardChapter"></select></div>
            </div>
            <div class="verse-range-row">
                <div class="verse-input"><label>시작 절</label><input type="number" id="startVerse" placeholder="예: 1" min="1"></div>
                <div class="verse-input"><label>끝 절</label><input type="number" id="endVerse" placeholder="예: 5" min="1"></div>
                <label class="whole-chapter-wrap">
                    <input type="checkbox" id="wholeChapter" onchange="toggleWholeChapter(this)">
                    <span>장 전체</span>
                </label>
            </div>
            <button class="btn btn-primary" style="margin-top:4px;" onclick="loadCardPreview()">본문 불러오기</button>
            <label>본문</label>
            <div id="cardTextDisplay"></div>
            <textarea id="cardText" rows="8" placeholder="위에서 불러오거나 직접 입력하세요." style="display:none;"></textarea>
            <p class="hl-hint">📌 본문 텍스트를 드래그하면 하이라이트를 적용할 수 있어요.</p>
            <label>키워드</label>
            <div class="keyword-wrap" id="keywordWrap">
                <div class="keyword-tags" id="keywordTags" onclick="focusKwInput()">
                    <input type="text" class="kw-tag-input" id="kwInput" placeholder="입력 또는 선택"
                        oninput="onKwInput()" onkeydown="onKwKeydown(event)" onfocus="showKwDropdown()" autocomplete="off">
                </div>
                <div class="kw-dropdown" id="kwDropdown"></div>
            </div>

        </div>
    </div>


    <!-- 해시태그 -->
    <div id="tag-panel" class="panel">
        <p class="tab-hint">성경책·장별로 해시태그를 달고 같은 태그끼리 모아볼 수 있습니다.</p>

        <!-- 태그 입력 영역 -->
        <div class="card-box" style="margin-bottom:16px;">
            <div class="testament-toggle">
                <button class="testament-btn active" onclick="switchTagTestament('ot',this)">구약</button>
                <button class="testament-btn" onclick="switchTagTestament('nt',this)">신약</button>
            </div>
            <div class="row">
                <div><label>성경책</label><select id="tagBook" onchange="updateChapters('tagBook','tagChapter');"></select></div>
                <div><label>장</label><select id="tagChapter"></select></div>
            </div>
            <label>해시태그 입력</label>
            <div class="tag-input-wrap" id="tagInputWrap">
                <div class="keyword-tags" id="tagInputTags" onclick="document.getElementById('tagRawInput').focus()">
                    <input type="text" class="kw-tag-input" id="tagRawInput"
                        placeholder="태그 입력 후 Enter"
                        onkeydown="onTagInputKeydown(event)"
                        onfocus="showTagDropdown()"
                        oninput="renderTagDropdown(this.value)"
                        autocomplete="off">
                </div>
                <div class="kw-dropdown" id="tagDropdown"></div>
            </div>
            <button class="btn btn-primary" onclick="saveChapterTags()">💾 저장</button>
        </div>

        <!-- 태그별 모아보기 -->
        <div class="filter-section" style="margin-bottom:16px;">
            <div class="filter-row">
                <span class="filter-label"># 태그 필터</span>
                <div class="filter-badges" id="tagFilterBadges"></div>
            </div>
        </div>

        <div id="tagListDisplay"></div>
    </div>

    <!-- 보관함 -->
    <div id="view-panel" class="panel">
        <p class="tab-hint">저장된 말씀 카드를 키워드 또는 성경책으로 필터링할 수 있습니다.</p>
        <div class="filter-section">
            <div class="filter-row">
                <span class="filter-label"># 키워드</span>
                <div class="filter-badges" id="kwFilterBadges"></div>
            </div>
            <div class="filter-divider"></div>
            <div class="filter-row">
                <span class="filter-label">📖 성경책</span>
                <div class="filter-badges" id="bookFilterBadges"></div>
            </div>
        </div>
        <div class="view-toolbar">
            <button class="btn-toolbar btn-delete-mode" id="btnDeleteMode" onclick="toggleDeleteMode()">🗑️ 삭제</button>
            <button class="btn-toolbar btn-delete-confirm" id="btnDeleteConfirm" onclick="confirmDelete()">삭제 확인</button>
            <button class="btn-toolbar btn-cancel-del" id="btnCancelDel" onclick="cancelDeleteMode()">취소</button>
        </div>
        <div id="savedCardsDisplay"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const otBooks = [
        {id:"gen",name:"창세기",file:"genesis",chapters:50},
        {id:"exo",name:"출애굽기",file:"exodus",chapters:40},
        {id:"lev",name:"레위기",file:"leviticus",chapters:27},
        {id:"num",name:"민수기",file:"numbers",chapters:36},
        {id:"deu",name:"신명기",file:"deuteronomy",chapters:34},
        {id:"jos",name:"여호수아",file:"joshua",chapters:24},
        {id:"jdg",name:"사사기",file:"judges",chapters:21},
        {id:"rut",name:"룻기",file:"ruth",chapters:4},
        {id:"1sa",name:"사무엘상",file:"1samuel",chapters:31},
        {id:"2sa",name:"사무엘하",file:"2samuel",chapters:24},
        {id:"1ki",name:"열왕기상",file:"1kings",chapters:22},
        {id:"2ki",name:"열왕기하",file:"2kings",chapters:25},
        {id:"1ch",name:"역대상",file:"1chronicles",chapters:29},
        {id:"2ch",name:"역대하",file:"2chronicles",chapters:36},
        {id:"ezr",name:"에스라",file:"ezra",chapters:10},
        {id:"neh",name:"느헤미야",file:"nehemiah",chapters:13},
        {id:"est",name:"에스더",file:"esther",chapters:10},
        {id:"job",name:"욥기",file:"job",chapters:42},
        {id:"psa",name:"시편",file:"psalms",chapters:150},
        {id:"pro",name:"잠언",file:"proverbs",chapters:31},
        {id:"ecc",name:"전도서",file:"ecclesiastes",chapters:12},
        {id:"sng",name:"아가",file:"song",chapters:8},
        {id:"isa",name:"이사야",file:"isaiah",chapters:66},
        {id:"jer",name:"예레미야",file:"jeremiah",chapters:52},
        {id:"lam",name:"예레미야애가",file:"lamentations",chapters:5},
        {id:"ezk",name:"에스겔",file:"ezekiel",chapters:48},
        {id:"dan",name:"다니엘",file:"daniel",chapters:12},
        {id:"hos",name:"호세아",file:"hosea",chapters:14},
        {id:"jol",name:"요엘",file:"joel",chapters:3},
        {id:"amo",name:"아모스",file:"amos",chapters:9},
        {id:"oba",name:"오바댜",file:"obadiah",chapters:1},
        {id:"jon",name:"요나",file:"jonah",chapters:4},
        {id:"mic",name:"미가",file:"micah",chapters:7},
        {id:"nam",name:"나훔",file:"nahum",chapters:3},
        {id:"hab",name:"하박국",file:"habakkuk",chapters:3},
        {id:"zep",name:"스바냐",file:"zephaniah",chapters:3},
        {id:"hag",name:"학개",file:"haggai",chapters:2},
        {id:"zec",name:"스가랴",file:"zechariah",chapters:14},
        {id:"mal",name:"말라기",file:"malachi",chapters:4},
    ];
    const ntBooks = [
        {id:"mat",name:"마태복음",file:"matthew",chapters:28},
        {id:"mrk",name:"마가복음",file:"mark",chapters:16},
        {id:"luk",name:"누가복음",file:"luke",chapters:24},
        {id:"jhn",name:"요한복음",file:"john",chapters:21},
        {id:"act",name:"사도행전",file:"acts",chapters:28},
        {id:"rom",name:"로마서",file:"romans",chapters:16},
        {id:"1co",name:"고린도전서",file:"1corinthians",chapters:16},
        {id:"2co",name:"고린도후서",file:"2corinthians",chapters:13},
        {id:"gal",name:"갈라디아서",file:"galatians",chapters:6},
        {id:"eph",name:"에베소서",file:"ephesians",chapters:6},
        {id:"php",name:"빌립보서",file:"philippians",chapters:4},
        {id:"col",name:"골로새서",file:"colossians",chapters:4},
        {id:"1th",name:"데살로니가전서",file:"1thessalonians",chapters:5},
        {id:"2th",name:"데살로니가후서",file:"2thessalonians",chapters:3},
        {id:"1ti",name:"디모데전서",file:"1timothy",chapters:6},
        {id:"2ti",name:"디모데후서",file:"2timothy",chapters:4},
        {id:"tit",name:"디도서",file:"titus",chapters:3},
        {id:"phm",name:"빌레몬서",file:"philemon",chapters:1},
        {id:"heb",name:"히브리서",file:"hebrews",chapters:13},
        {id:"jas",name:"야고보서",file:"james",chapters:5},
        {id:"1pe",name:"베드로전서",file:"1peter",chapters:5},
        {id:"2pe",name:"베드로후서",file:"2peter",chapters:3},
        {id:"1jn",name:"요한일서",file:"1john",chapters:5},
        {id:"2jn",name:"요한이서",file:"2john",chapters:1},
        {id:"3jn",name:"요한삼서",file:"3john",chapters:1},
        {id:"jud",name:"유다서",file:"jude",chapters:1},
        {id:"rev",name:"요한계시록",file:"revelation",chapters:22},
    ];
    const allBooks = [...otBooks, ...ntBooks];

    function getBook(id){ return allBooks.find(b=>b.id===id); }

    function switchTestament(type, btn){
        document.querySelectorAll('#read-panel .testament-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        populateBookSelect('readBook', type==='ot'?otBooks:ntBooks);
        updateChapters('readBook','readChapter');
        loadBibleVerses();
    }
    function switchTestamentCard(type, btn){
        document.querySelectorAll('#create-panel .testament-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        populateBookSelect('cardBook', type==='ot'?otBooks:ntBooks);
        updateChapters('cardBook','cardChapter');
    }
    function populateBookSelect(selectId, books){
        const sel=document.getElementById(selectId); sel.innerHTML="";
        books.forEach(b=>{ const o=document.createElement("option"); o.value=b.id; o.textContent=b.name; sel.appendChild(o); });
    }

    async function getBibleData(bookId){
        const book=getBook(bookId);
        if(!book) throw new Error(`책 ID 없음: ${bookId}`);
        const res=await fetch(`./krv_eng/${book.file}.json`);
        if(!res.ok) throw new Error(`로드 실패(${res.status}): ${book.file}.json`);
        return await res.json();
    }

    // ─── 열람/검색 모드 전환 ───
    let currentReadMode = 'read';
    function switchReadMode(mode){
        currentReadMode = mode;
        document.getElementById('modeRead').classList.toggle('active', mode==='read');
        document.getElementById('modeSearch').classList.toggle('active', mode==='search');
        document.getElementById('readModeBox').style.display = mode==='read'?'block':'none';
        document.getElementById('searchModeBox').style.display = mode==='search'?'block':'none';
        if(mode==='search') document.getElementById('searchInput').focus();
    }

    // ─── 키워드 검색 ───
    let searchResults = [];
    let isSearching   = false;

    async function doSearch(){
        const query = document.getElementById('searchInput').value.trim();
        if(!query){ showToast('검색어를 입력해 주세요.'); return; }
        if(isSearching){ showToast('검색 중입니다. 잠시 기다려 주세요.'); return; }

        isSearching   = true;
        searchResults = [];
        const resultsEl = document.getElementById('searchResults');
        resultsEl.innerHTML = `
            <div class="search-progress" id="searchProgress">
                <div>전체 66권 검색 중... <span id="searchProgressText">0 / 66</span></div>
                <div class="progress-bar-wrap"><div class="progress-bar" id="searchProgressBar" style="width:0%"></div></div>
            </div>`;

        let done = 0;
        for(const book of allBooks){
            try{
                const data = await getBibleData(book.id);
                const chapters = data.chapters || [];
                chapters.forEach(ch=>{
                    (ch.verses||[]).forEach(v=>{
                        if(v.text && v.text.includes(query)){
                            searchResults.push({ bookName:book.name, chapter:ch.chapter, verse:v.verse, text:v.text });
                        }
                    });
                });
            } catch(e){ /* 파일 없으면 스킵 */ }
            done++;
            const pct = Math.round(done/allBooks.length*100);
            const bar = document.getElementById('searchProgressBar');
            const txt = document.getElementById('searchProgressText');
            if(bar) bar.style.width = pct+'%';
            if(txt) txt.textContent = `${done} / ${allBooks.length}`;
            await new Promise(r=>setTimeout(r,0)); // UI 업데이트 허용
        }

        isSearching = false;
        renderSearchResults(query);
    }

    function renderSearchResults(query){
        const el = document.getElementById('searchResults');
        if(searchResults.length===0){
            el.innerHTML=`<div class="status-msg">"${query}" 검색 결과가 없어요.</div>`;
            return;
        }
        el.innerHTML=`
            <div class="search-header">
                <span class="search-count">총 ${searchResults.length}개의 결과</span>
            </div>
            ${searchResults.map((r,i)=>`
                <div class="search-result-item" onclick="showVerseDetail(${i})">
                    <div class="search-result-ref">📖 ${r.bookName} ${r.chapter}장 ${r.verse}절</div>
                    <div class="search-result-text">${r.text.replace(new RegExp(escapeRegex(document.getElementById('searchInput').value.trim()),'g'), m=>`<mark>${m}</mark>`)}</div>
                </div>
            `).join('')}`;
    }

    function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

    // ─── 절 상세 보기 ───
    function showVerseDetail(index){
        const r   = searchResults[index];
        const q   = document.getElementById('searchInput').value.trim();
        const el  = document.getElementById('searchResults');
        const highlighted = r.text.replace(new RegExp(escapeRegex(q),'g'), m=>`<mark>${m}</mark>`);
        el.innerHTML=`
            <div class="verse-detail-header">
                <button class="btn-back" onclick="renderSearchResults('${q}')">← 목록으로</button>
                <span class="verse-detail-ref">${r.bookName} ${r.chapter}장 ${r.verse}절</span>
            </div>
            <div class="card-box" style="margin-top:0;">
                <div style="font-family:'Noto Serif KR',serif;font-size:0.95rem;line-height:2;color:var(--ink);">${highlighted}</div>
            </div>`;
    }

    // ─── 장별 열람 ───
    function toggleWholeChapter(checkbox){
        const s=document.getElementById("startVerse"), e=document.getElementById("endVerse");
        s.disabled=e.disabled=checkbox.checked;
        if(checkbox.checked){s.value="";e.value="";}
    }

    async function loadBibleVerses(){
        const bookId=document.getElementById("readBook").value;
        const chapter=document.getElementById("readChapter").value;
        const viewer=document.getElementById("bibleViewer");
        viewer.innerHTML='<div class="status-msg">📖 말씀을 불러오는 중입니다...</div>';
        try{
            const data=await getBibleData(bookId);
            let verses=[];
            if(data.chapters&&Array.isArray(data.chapters)){
                const tgt=data.chapters.find(c=>c.chapter==chapter);
                if(tgt&&tgt.verses) verses=tgt.verses.map(v=>({verse:v.verse,text:v.text}));
            } else if(Array.isArray(data)){
                verses=data.filter(v=>v.chapter==chapter);
            }
            if(verses.length===0){viewer.innerHTML=`<div class="status-msg status-err">⚠️ ${chapter}장 데이터를 불러올 수 없습니다.</div>`;return;}
            viewer.innerHTML="";
            verses.forEach(v=>{
                const div=document.createElement("div"); div.className="verse-item";
                div.dataset.verse=v.verse; div.dataset.text=v.text;
                div.innerHTML=`<span class="verse-num">${v.verse}</span><span>${v.text}</span>`;
                div.addEventListener('click', ()=>toggleVerseSelection(div, v.verse, v.text));
                viewer.appendChild(div);
            });
        } catch(err){ viewer.innerHTML=`<div class="status-msg status-err">⚠️ 오류: ${err.message}</div>`; }
    }

    async function loadCardPreview(){
        const bookId=document.getElementById("cardBook").value;
        const chapter=document.getElementById("cardChapter").value;
        const isWhole=document.getElementById("wholeChapter").checked;
        const start=parseInt(document.getElementById("startVerse").value);
        const end=parseInt(document.getElementById("endVerse").value);
        const textarea=document.getElementById("cardText");
        if(!isWhole&&(!start||!end)){showToast("시작 절과 끝 절을 입력해 주세요.");return;}
        if(!isWhole&&start>end){showToast("시작 절이 끝 절보다 클 수 없어요.");return;}
        textarea.value="불러오는 중...";
        try{
            const data=await getBibleData(bookId);
            let verses=[];
            if(data.chapters&&Array.isArray(data.chapters)){
                const tgt=data.chapters.find(c=>c.chapter==chapter);
                if(tgt&&tgt.verses) verses=isWhole?tgt.verses:tgt.verses.filter(v=>v.verse>=start&&v.verse<=end);
            } else if(Array.isArray(data)){
                verses=isWhole?data.filter(v=>v.chapter==chapter):data.filter(v=>v.chapter==chapter&&v.verse>=start&&v.verse<=end);
            }
            if(verses.length===0){textarea.value="";showToast("해당 범위의 말씀을 찾을 수 없어요.");return;}
            textarea.value=verses.map(v=>`${v.verse}절  ${v.text}`).join("\n");
        } catch(err){textarea.value="";showToast(`오류: ${err.message}`);}
    }

    // ─── 키워드 태그 ───
    let selectedKeywords=[];
    function getAllKeywords(){
        const all=new Set();
        getSavedCards().forEach(c=>{
            if(Array.isArray(c.keywords)) c.keywords.forEach(k=>all.add(k));
            else if(c.keyword) c.keyword.split(',').map(k=>k.trim()).filter(Boolean).forEach(k=>all.add(k));
        });
        return [...all];
    }
    function renderKwTags(){
        const container=document.getElementById("keywordTags");
        const input=document.getElementById("kwInput");
        container.querySelectorAll('.kw-tag').forEach(el=>el.remove());
        selectedKeywords.forEach(kw=>{
            const tag=document.createElement("div"); tag.className="kw-tag";
            tag.innerHTML=`<span>${kw}</span><button type="button" onclick="removeKwTag('${kw}')">×</button>`;
            container.insertBefore(tag,input);
        });
    }
    function addKwTag(kw){
        kw=kw.trim(); if(!kw||selectedKeywords.includes(kw)) return;
        selectedKeywords.push(kw); renderKwTags();
        document.getElementById("kwInput").value=""; renderKwDropdown("");
    }
    function removeKwTag(kw){ selectedKeywords=selectedKeywords.filter(k=>k!==kw); renderKwTags(); renderKwDropdown(document.getElementById("kwInput").value); }
    function focusKwInput(){ document.getElementById("kwInput").focus(); }
    function onKwInput(){ renderKwDropdown(document.getElementById("kwInput").value); }
    function onKwKeydown(e){
        if(e.key==='Enter'||e.key===','){e.preventDefault();const val=document.getElementById("kwInput").value.trim();if(val)addKwTag(val);}
        if(e.key==='Backspace'&&!document.getElementById("kwInput").value&&selectedKeywords.length>0) removeKwTag(selectedKeywords[selectedKeywords.length-1]);
    }
    function showKwDropdown(){ renderKwDropdown(document.getElementById("kwInput").value); }
    function renderKwDropdown(query){
        const dropdown=document.getElementById("kwDropdown");
        const all=getAllKeywords(); const filtered=all.filter(k=>k.includes(query));
        if(filtered.length===0&&!query){dropdown.classList.remove('show');return;}
        dropdown.classList.add('show');
        if(filtered.length===0){
            dropdown.innerHTML=query?`<div class="kw-dropdown-item" onclick="addKwTag('${query}')">+ "${query}" 추가</div>`:`<div class="kw-dropdown-empty">저장된 키워드가 없어요.</div>`;
            return;
        }
        dropdown.innerHTML=filtered.map(k=>`<div class="kw-dropdown-item ${selectedKeywords.includes(k)?'selected':''}" onclick="addKwTag('${k}')">${k}</div>`).join('');
        if(query&&!filtered.includes(query)) dropdown.innerHTML+=`<div class="kw-dropdown-item" onclick="addKwTag('${query}')">+ "${query}" 추가</div>`;
    }
    document.addEventListener('click',e=>{ if(!document.getElementById('keywordWrap').contains(e.target)) document.getElementById('kwDropdown').classList.remove('show'); });

    // ─── 카드 저장 ───
    function saveWordCard(){
        const bookId=document.getElementById("cardBook").value;
        const chapter=document.getElementById("cardChapter").value;
        const isWhole=document.getElementById("wholeChapter").checked;
        const start=document.getElementById("startVerse").value;
        const end=document.getElementById("endVerse").value;
        const text=document.getElementById("cardText").value.trim();
        const memo=document.getElementById("cardMemo").value.trim();
        const rawInput=document.getElementById("kwInput").value.trim();
        if(rawInput) addKwTag(rawInput);
        const keywords=[...selectedKeywords];
        if(!text){showToast("본문을 먼저 불러와 주세요.");return;}
        const book=getBook(bookId);
        const ref=isWhole?`${book.name} ${chapter}장 전체`:`${book.name} ${chapter}장 ${start}-${end}절`;
        const saved=getSavedCards();
        saved.push({ref,bookName:book.name,text,keywords,memo,date:new Date().toLocaleDateString("ko-KR")});
        localStorage.setItem("wordCards",JSON.stringify(saved));
        document.getElementById("cardText").value="";
        document.getElementById("kwInput").value="";
        document.getElementById("cardMemo").value="";
        document.getElementById("startVerse").value="";
        document.getElementById("endVerse").value="";
        document.getElementById("wholeChapter").checked=false;
        document.getElementById("startVerse").disabled=false;
        document.getElementById("endVerse").disabled=false;
        selectedKeywords=[]; renderKwTags();
        clearDraft();
        checkDraftIndicator();
        showToast("💝 말씀 카드가 저장되었어요!");
    }

    function getSavedCards(){ try{return JSON.parse(localStorage.getItem("wordCards"))||[];}catch{return[];} }

    // ─── 보관함 필터 ───
    let activeKeywords=[], activeBook=null;
    function toggleKwFilter(kw){ activeKeywords=activeKeywords.includes(kw)?activeKeywords.filter(k=>k!==kw):[...activeKeywords,kw]; renderCards(); }
    function toggleBookFilter(bn){ activeBook=activeBook===bn?null:bn; renderCards(); }
    function buildFilters(cards){
        const kwSet=new Set();
        cards.forEach(c=>{ if(Array.isArray(c.keywords))c.keywords.forEach(k=>kwSet.add(k)); else if(c.keyword)c.keyword.split(',').map(k=>k.trim()).filter(Boolean).forEach(k=>kwSet.add(k)); });
        document.getElementById("kwFilterBadges").innerHTML=kwSet.size===0?`<span style="font-size:0.75rem;color:var(--ink-faint);">없음</span>`:[...kwSet].map(kw=>`<span class="badge ${activeKeywords.includes(kw)?'active':''}" onclick="toggleKwFilter('${kw}')">${kw}</span>`).join('');
        const bookSet=new Set(cards.map(c=>c.bookName||c.ref?.split(' ')[0]).filter(Boolean));
        document.getElementById("bookFilterBadges").innerHTML=bookSet.size===0?`<span style="font-size:0.75rem;color:var(--ink-faint);">없음</span>`:[...bookSet].map(bn=>`<span class="badge ${activeBook===bn?'active':''}" onclick="toggleBookFilter('${bn}')">${bn}</span>`).join('');
    }

    // ─── 삭제 모드 ───
    let isDeleteMode=false;
    function toggleDeleteMode(){
        isDeleteMode=true;
        document.getElementById("btnDeleteMode").style.display="none";
        document.getElementById("btnDeleteConfirm").style.display="inline-block";
        document.getElementById("btnCancelDel").style.display="inline-block";
        document.getElementById("savedCardsDisplay").classList.add("delete-mode");
    }
    function cancelDeleteMode(){
        isDeleteMode=false;
        document.getElementById("btnDeleteMode").style.display="inline-block";
        document.getElementById("btnDeleteConfirm").style.display="none";
        document.getElementById("btnCancelDel").style.display="none";
        document.getElementById("savedCardsDisplay").classList.remove("delete-mode");
        document.querySelectorAll('.card-check').forEach(cb=>{cb.checked=false;});
        document.querySelectorAll('.word-card').forEach(c=>c.classList.remove('selected'));
    }
    function confirmDelete(){
        const checked=[...document.querySelectorAll('.card-check:checked')];
        if(checked.length===0){showToast("삭제할 카드를 선택해 주세요.");return;}
        if(!confirm(`선택한 ${checked.length}개의 카드를 삭제할까요?`)) return;
        const toDelete=new Set(checked.map(cb=>parseInt(cb.dataset.index)));
        const cards=getSavedCards().filter((_,i)=>!toDelete.has(i));
        localStorage.setItem("wordCards",JSON.stringify(cards));
        cancelDeleteMode(); renderCards();
        showToast(`${toDelete.size}개의 카드가 삭제되었어요.`);
    }
    function onCardCheck(index,checked){ const card=document.getElementById(`card-${index}`); if(checked)card.classList.add('selected'); else card.classList.remove('selected'); }

    // ─── 접기/펼치기 ───
    function toggleText(index){ const wrap=document.getElementById(`text-${index}`),btn=document.getElementById(`tbtn-${index}`); const isOpen=wrap.classList.toggle('open'); btn.textContent=isOpen?'▲ 본문':'▼ 본문'; btn.classList.toggle('open',isOpen); }
    function toggleMemo(index){ const wrap=document.getElementById(`memo-${index}`),btn=document.getElementById(`mbtn-${index}`); const isClosed=wrap.classList.toggle('closed'); btn.textContent=isClosed?'▼ 묵상':'▲ 묵상'; btn.classList.toggle('open',!isClosed); }

    // ─── 카드 렌더링 ───
    function renderCards(){
        const cards=getSavedCards(), display=document.getElementById("savedCardsDisplay");
        buildFilters(cards);
        let filtered=[...cards];
        if(activeKeywords.length>0) filtered=filtered.filter(c=>{ const kws=Array.isArray(c.keywords)?c.keywords:(c.keyword||'').split(',').map(k=>k.trim()).filter(Boolean); return activeKeywords.every(ak=>kws.includes(ak)); });
        if(activeBook) filtered=filtered.filter(c=>(c.bookName||c.ref?.split(' ')[0])===activeBook);
        if(filtered.length===0){ display.innerHTML=`<div class="empty-state">조건에 맞는 카드가 없어요.</div>`; return; }
        display.innerHTML=[...filtered].reverse().map(c=>{
            const realIndex=cards.indexOf(c);
            const kws=Array.isArray(c.keywords)?c.keywords:(c.keyword||'').split(',').map(k=>k.trim()).filter(Boolean);
            const kwPreview=kws.length?`<div class="card-kw-preview">${kws.map(k=>`<span class="kw-chip">${k}</span>`).join('')}</div>`:'';
            const memoBtn=c.memo?`<button class="toggle-btn open" id="mbtn-${realIndex}" onclick="toggleMemo(${realIndex})">▲ 묵상</button>`:`<button class="toggle-btn hidden" id="mbtn-${realIndex}"></button>`;
            const memoBody=c.memo?`<div class="word-card-memo-wrap" id="memo-${realIndex}"><div class="word-card-memo">${c.memo}</div></div>`:`<div class="word-card-memo-wrap closed" id="memo-${realIndex}"></div>`;
            return `<div class="word-card" id="card-${realIndex}">
                <div class="card-checkbox-wrap"><input type="checkbox" class="card-check" data-index="${realIndex}" onchange="onCardCheck(${realIndex},this.checked)"></div>
                <div class="card-content">
                    <div class="word-card-header">
                        <div class="header-left"><div class="word-card-ref">📖 ${c.ref}</div>${kwPreview}</div>
                        <div class="header-right"><span class="card-date">${c.date}</span><div class="header-btns"><button class="toggle-btn" id="tbtn-${realIndex}" onclick="toggleText(${realIndex})">▼ 본문</button>${memoBtn}</div></div>
                    </div>
                    <div class="word-card-text-wrap" id="text-${realIndex}"><div class="word-card-text" id="wct-${realIndex}">${c.text}</div></div>
                    ${memoBody}
                    <div class="card-actions"><button class="btn-edit" onclick="startEdit(${realIndex})">✏️ 수정</button></div>
                </div>
            </div>`;
        }).join('');
        if(isDeleteMode) display.classList.add("delete-mode");
    }

    function startEdit(index){
        const cards=getSavedCards(), c=cards[index], cardEl=document.getElementById(`card-${index}`);
        const kws=Array.isArray(c.keywords)?c.keywords:(c.keyword||'').split(',').map(k=>k.trim()).filter(Boolean);
        cardEl.innerHTML=`<div class="card-content" style="width:100%;"><div class="word-card-ref" style="margin-bottom:10px;">📖 ${c.ref} · ${c.date}</div><div class="edit-form"><textarea id="edit-text-${index}" rows="6">${c.text}</textarea><input type="text" id="edit-keyword-${index}" value="${kws.join(', ')}" placeholder="키워드 (쉼표로 구분)"><textarea id="edit-memo-${index}" rows="2" placeholder="묵상 기록">${c.memo||''}</textarea></div><div class="card-actions"><button class="btn-save" onclick="saveEdit(${index})">💾 저장</button><button class="btn-cancel-edit" onclick="renderCards()">✕ 취소</button></div></div>`;
    }
    function saveEdit(index){
        const cards=getSavedCards();
        const keywords=document.getElementById(`edit-keyword-${index}`).value.split(',').map(k=>k.trim()).filter(Boolean);
        cards[index].text=document.getElementById(`edit-text-${index}`).value.trim();
        cards[index].keywords=keywords; cards[index].keyword=keywords.join(', ');
        cards[index].memo=document.getElementById(`edit-memo-${index}`).value.trim();
        localStorage.setItem("wordCards",JSON.stringify(cards)); renderCards(); showToast("카드가 수정되었어요.");
    }

    // ─── 공통 유틸 ───
    function switchTab(pId,btn){
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        document.getElementById(pId).classList.add('active'); btn.classList.add('active');
        if(pId==='view-panel'){cancelDeleteMode();renderCards();}
        if(pId==='tag-panel'){renderTagList();loadExistingTags();}
        if(pId==='create-panel'){restoreDraft(); checkDraftIndicator();}
    }
    function updateChapters(bookSelectId,chapterSelectId){
        const book=getBook(document.getElementById(bookSelectId).value);
        const sel=document.getElementById(chapterSelectId); sel.innerHTML="";
        for(let i=1;i<=book.chapters;i++) sel.innerHTML+=`<option value="${i}">${i}장</option>`;
    }

    // ─── 절 선택 → 카드 작성 ───
    let selectedVerses = []; // [{verse, text}]

    function toggleVerseSelection(div, verse, text){
        const idx = selectedVerses.findIndex(v=>v.verse==verse);
        if(idx>=0){
            selectedVerses.splice(idx,1);
            div.classList.remove('selected');
        } else {
            selectedVerses.push({verse, text});
            div.classList.add('selected');
        }
        updateVerseSelectBar();
    }

    function updateVerseSelectBar(){
        const bar  = document.getElementById('verseSelectBar');
        const info = document.getElementById('verseSelectInfo');
        if(selectedVerses.length===0){
            bar.classList.remove('show');
        } else {
            bar.classList.add('show');
            const sorted = [...selectedVerses].sort((a,b)=>a.verse-b.verse);
            const first = sorted[0].verse, last = sorted[sorted.length-1].verse;
            info.textContent = first===last ? `${first}절 선택됨` : `${first}-${last}절 선택됨 (${selectedVerses.length}개)`;
        }
    }

    function clearVerseSelection(){
        selectedVerses=[];
        document.querySelectorAll('.verse-item.selected').forEach(el=>el.classList.remove('selected'));
        updateVerseSelectBar();
    }

    function makeCardFromSelection(){
        if(selectedVerses.length===0) return;

        const bookId  = document.getElementById('readBook').value;
        const chapter = document.getElementById('readChapter').value;
        const book    = getBook(bookId);
        const sorted  = [...selectedVerses].sort((a,b)=>a.verse-b.verse);
        const first   = sorted[0].verse, last = sorted[sorted.length-1].verse;

        // 카드 생성 탭으로 이동하면서 데이터 채우기
        // 성경책/장 동기화
        // cardBook select에 같은 책이 없을 수 있으니 testament도 맞춰줌
        const isOT = otBooks.some(b=>b.id===bookId);
        const createPanel = document.getElementById('create-panel');

        // testament 맞추기
        const cardTestamentBtns = document.querySelectorAll('#create-panel .testament-btn');
        cardTestamentBtns.forEach(b=>b.classList.remove('active'));
        cardTestamentBtns[isOT?0:1].classList.add('active');
        populateBookSelect('cardBook', isOT?otBooks:ntBooks);
        document.getElementById('cardBook').value = bookId;
        updateChapters('cardBook','cardChapter');
        document.getElementById('cardChapter').value = chapter;

        // 절 범위 채우기
        document.getElementById('startVerse').value = first;
        document.getElementById('endVerse').value   = last;
        document.getElementById('wholeChapter').checked = false;
        document.getElementById('startVerse').disabled   = false;
        document.getElementById('endVerse').disabled     = false;

        // 본문 채우기 (선택된 절만)
        const plainText = sorted.map(v=>`${v.verse}절  ${v.text}`).join('\n');
        const display   = document.getElementById('cardTextDisplay');
        display.innerHTML = plainText.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
        syncTextareaFromDisplay();

        // 탭 전환
        const createBtn = document.querySelector('.tab-btn[onclick*="create-panel"]');
        switchTab('create-panel', createBtn);

        // 선택 해제
        clearVerseSelection();
        saveDraft();
        checkDraftIndicator();
    }

    // ─── 카드 작성 임시저장 (탭 이동해도 유지) ───
    function saveDraft(){
        const draft = {
            bookId   : document.getElementById('cardBook').value,
            chapter  : document.getElementById('cardChapter').value,
            start    : document.getElementById('startVerse').value,
            end      : document.getElementById('endVerse').value,
            isWhole  : document.getElementById('wholeChapter').checked,
            textHtml : document.getElementById('cardTextDisplay').innerHTML,
            memo     : document.getElementById('cardMemo').value,
            keywords : [...selectedKeywords],
        };
        localStorage.setItem('cardDraft', JSON.stringify(draft));
    }

    function restoreDraft(){
        try{
            const draft = JSON.parse(localStorage.getItem('cardDraft'));
            if(!draft || !draft.textHtml) return;

            // 책 복원
            const isOT = otBooks.some(b=>b.id===draft.bookId);
            const cardTestamentBtns = document.querySelectorAll('#create-panel .testament-btn');
            cardTestamentBtns.forEach(b=>b.classList.remove('active'));
            cardTestamentBtns[isOT?0:1].classList.add('active');
            populateBookSelect('cardBook', isOT?otBooks:ntBooks);
            document.getElementById('cardBook').value = draft.bookId;
            updateChapters('cardBook','cardChapter');
            document.getElementById('cardChapter').value   = draft.chapter;
            document.getElementById('startVerse').value    = draft.start;
            document.getElementById('endVerse').value      = draft.end;
            document.getElementById('wholeChapter').checked= draft.isWhole;
            document.getElementById('startVerse').disabled = draft.isWhole;
            document.getElementById('endVerse').disabled   = draft.isWhole;
            document.getElementById('cardTextDisplay').innerHTML = draft.textHtml;
            document.getElementById('cardText').value = draft.textHtml;
            document.getElementById('cardMemo').value = draft.memo||'';
            selectedKeywords = draft.keywords||[];
            renderKwTags();
        } catch(e){ /* 무시 */ }
    }

    function clearDraft(){
        localStorage.removeItem('cardDraft');
    }

    function checkDraftIndicator(){
        const ind = document.getElementById('draftIndicator');
        if(!ind) return;
        const draft = localStorage.getItem('cardDraft');
        try{
            const d = JSON.parse(draft);
            ind.classList.toggle('show', !!(d && d.textHtml));
        } catch{ ind.classList.remove('show'); }
    }

    // 카드 생성 탭에서 입력 변경 시 자동 임시저장
    function autoDraft(){
        const panel = document.getElementById('create-panel');
        if(panel.classList.contains('active')) saveDraft();
    }

    function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }
    // ─── 해시태그 기능 ───
    function getChapterTags(){ try{return JSON.parse(localStorage.getItem("chapterTags"))||{};}catch{return{};} }
    function saveChapterTagsData(data){ localStorage.setItem("chapterTags", JSON.stringify(data)); }

    let tagInputSelected = [];
    let activeTagFilter  = null;

    function switchTagTestament(type, btn){
        document.querySelectorAll('#tag-panel .testament-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        populateBookSelect('tagBook', type==='ot'?otBooks:ntBooks);
        updateChapters('tagBook','tagChapter');
        // 선택된 장의 기존 태그 불러오기
        loadExistingTags();
    }

    function loadExistingTags(){
        const bookId  = document.getElementById('tagBook').value;
        const chapter = document.getElementById('tagChapter').value;
        const book    = getBook(bookId);
        const key     = `${book.name}_${chapter}`;
        const data    = getChapterTags();
        tagInputSelected = data[key] ? [...data[key]] : [];
        renderTagInputTags();
    }

    function renderTagInputTags(){
        const container = document.getElementById('tagInputTags');
        const input     = document.getElementById('tagRawInput');
        container.querySelectorAll('.kw-tag').forEach(el=>el.remove());
        tagInputSelected.forEach(t=>{
            const tag = document.createElement('div');
            tag.className = 'kw-tag';
            tag.innerHTML = `<span>#${t}</span><button type="button" onclick="removeTagInput('${t}')">×</button>`;
            container.insertBefore(tag, input);
        });
    }

    function addTagInput(t){
        t = t.trim().replace(/^#/,'');
        if(!t || tagInputSelected.includes(t)) return;
        tagInputSelected.push(t);
        renderTagInputTags();
        document.getElementById('tagRawInput').value='';
        renderTagDropdown('');
    }

    function removeTagInput(t){
        tagInputSelected = tagInputSelected.filter(x=>x!==t);
        renderTagInputTags();
    }

    function onTagInputKeydown(e){
        if(e.key==='Enter'||e.key===','){
            e.preventDefault();
            const val = document.getElementById('tagRawInput').value.trim();
            if(val) addTagInput(val);
        }
        if(e.key==='Backspace'&&!document.getElementById('tagRawInput').value&&tagInputSelected.length>0){
            removeTagInput(tagInputSelected[tagInputSelected.length-1]);
        }
    }

    function showTagDropdown(){
        renderTagDropdown(document.getElementById('tagRawInput').value);
    }

    function renderTagDropdown(query){
        const dropdown = document.getElementById('tagDropdown');
        // 기존 태그 전체 수집
        const data = getChapterTags();
        const allTags = new Set();
        Object.values(data).forEach(arr=>arr.forEach(t=>allTags.add(t)));
        const filtered = [...allTags].filter(t=>t.includes(query.replace(/^#/,'')));

        if(filtered.length===0 && !query){ dropdown.classList.remove('show'); return; }
        dropdown.classList.add('show');

        if(filtered.length===0){
            dropdown.innerHTML = query
                ? `<div class="kw-dropdown-item" onclick="addTagInput('${query.replace(/^#/,'')}')">+ "${query.replace(/^#/,'')}" 추가</div>`
                : `<div class="kw-dropdown-empty">저장된 태그가 없어요.</div>`;
            return;
        }
        dropdown.innerHTML = filtered.map(t=>
            `<div class="kw-dropdown-item ${tagInputSelected.includes(t)?'selected':''}" onclick="addTagInput('${t}')">#${t}</div>`
        ).join('');
        if(query && !filtered.includes(query.replace(/^#/,''))){
            dropdown.innerHTML += `<div class="kw-dropdown-item" onclick="addTagInput('${query.replace(/^#/,'')}')">+ "${query.replace(/^#/,'')}" 추가</div>`;
        }
    }

    document.addEventListener('click', e=>{
        const wrap = document.getElementById('tagInputWrap');
        if(wrap && !wrap.contains(e.target)) document.getElementById('tagDropdown').classList.remove('show');
    });

    function saveChapterTags(){
        const raw = document.getElementById('tagRawInput').value.trim();
        if(raw) addTagInput(raw);

        const bookId  = document.getElementById('tagBook').value;
        const chapter = document.getElementById('tagChapter').value;
        const book    = getBook(bookId);
        const key     = `${book.name}_${chapter}`;
        const data    = getChapterTags();
        data[key]     = [...tagInputSelected];
        saveChapterTagsData(data);
        renderTagList();
        showToast('태그가 저장되었어요!');
    }

    function renderTagList(){
        const data    = getChapterTags();
        const display = document.getElementById('tagListDisplay');
        const filterEl= document.getElementById('tagFilterBadges');

        // 전체 태그 수집 → 필터 배지
        const allTags = new Set();
        Object.values(data).forEach(arr=>arr.forEach(t=>allTags.add(t)));

        if(allTags.size===0){
            filterEl.innerHTML = `<span style="font-size:0.75rem;color:var(--ink-faint);">없음</span>`;
        } else {
            filterEl.innerHTML = [...allTags].map(t=>
                `<span class="badge ${activeTagFilter===t?'active':''}" onclick="toggleTagFilter('${t}')">#${t}</span>`
            ).join('');
        }

        // 태그가 달린 장 목록
        const entries = Object.entries(data).filter(([k,arr])=>arr.length>0);
        if(entries.length===0){
            display.innerHTML=`<div class="tag-empty">아직 태그가 없어요.<br>위에서 성경책·장을 선택하고 태그를 달아보세요.</div>`;
            return;
        }

        const filtered = activeTagFilter
            ? entries.filter(([k,arr])=>arr.includes(activeTagFilter))
            : entries;

        if(filtered.length===0){
            display.innerHTML=`<div class="tag-empty">#${activeTagFilter} 태그가 달린 장이 없어요.</div>`;
            return;
        }

        display.innerHTML = filtered.map(([key, tags])=>{
            const [bookName, chapter] = key.split('_');
            return `
                <div class="chapter-tag-card">
                    <div class="chapter-tag-ref">📖 ${bookName} ${chapter}장</div>
                    <div class="chapter-tag-badges">
                        ${tags.map(t=>`<span class="chapter-tag-badge" onclick="toggleTagFilter('${t}')">#${t}</span>`).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }

    function toggleTagFilter(t){
        activeTagFilter = activeTagFilter===t ? null : t;
        renderTagList();
    }

    // 성경 열람 탭에서도 해당 장의 태그 표시
    const _origLoadBibleVerses = loadBibleVerses;

        await _origLoadBibleVerses();

        const bookId  = document.getElementById('readBook').value;
        const chapter = document.getElementById('readChapter').value;

        const key     = `${book.name}_${chapter}`;
        const data    = getChapterTags();
        const tags    = data[key] || [];
        let tagEl = document.getElementById('chapterTagDisplay');
        if(!tagEl){
            tagEl = document.createElement('div');
            tagEl.id = 'chapterTagDisplay';
            tagEl.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;';
            const viewer = document.getElementById('bibleViewer');
            viewer.parentNode.insertBefore(tagEl, viewer);
        }
        tagEl.innerHTML = tags.length
            ? tags.map(t=>`<span class="chapter-tag-badge" style="cursor:default;">#${t}</span>`).join('')
            : '';
    };


    window.onload=()=>{
        populateBookSelect('readBook',otBooks); populateBookSelect('cardBook',otBooks);
        populateBookSelect('tagBook',otBooks);
        updateChapters('readBook','readChapter'); updateChapters('cardBook','cardChapter');
        updateChapters('tagBook','tagChapter');
        loadBibleVerses();
        checkDraftIndicator();
    };
</script>

        <button class="hl-remove-btn"       onclick="applyHighlight(null)">지우기</button>

<script>
// ─── 하이라이트 기능 ───
let savedRange = null;

// 본문 불러오기 후 display 영역에 렌더링
function renderCardTextDisplay(htmlContent){
    const display = document.getElementById('cardTextDisplay');
    display.innerHTML = htmlContent || '<span style="color:var(--ink-faint);font-size:0.85rem;">위에서 본문을 불러오거나 직접 입력하세요.</span>';
    // textarea는 plain text 백업용으로 숨김 유지
}

// cardText textarea 변경 시 display 동기화 (plain text → display)
function syncDisplayFromTextarea(){
    const raw = document.getElementById('cardText').value;
    if(!raw){ renderCardTextDisplay(''); return; }
    // plain text를 HTML로 변환 (줄바꿈 보존)
    const escaped = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    document.getElementById('cardTextDisplay').innerText = raw;
}

// display에서 드래그 후 마우스업 → 팝업 표시
document.addEventListener('mouseup', handleSelectionEnd);
document.addEventListener('touchend', handleSelectionEnd);

function handleSelectionEnd(e){
    const popup = document.getElementById('hlPopup');
    const display = document.getElementById('cardTextDisplay');

    // 팝업 안 클릭이면 무시
    if(popup.contains(e.target)) return;

    const sel = window.getSelection();
    if(!sel || sel.rangeCount === 0 || sel.isCollapsed){
        // 선택 없으면 팝업 닫기
        if(!popup.contains(e.target)) popup.classList.remove('show');
        return;
    }

    // display 영역 안에서만 동작
    const range = sel.getRangeAt(0);
    if(!display.contains(range.commonAncestorContainer)) return;

    savedRange = range.cloneRange();

    // 팝업 위치: 선택 영역 위
    const rect = range.getBoundingClientRect();
    const scrollY = window.scrollY || document.documentElement.scrollTop;
    popup.style.left = Math.max(8, rect.left + rect.width/2 - 80) + 'px';
    popup.style.top  = (rect.top + scrollY - popup.offsetHeight - 10) + 'px';
    popup.classList.add('show');

    // 위치 재계산 (팝업 높이 확정 후)
    requestAnimationFrame(()=>{
        popup.style.top = (rect.top + scrollY - popup.offsetHeight - 10) + 'px';
    });
}

// 팝업 외부 클릭 시 닫기
document.addEventListener('mousedown', e=>{
    const popup = document.getElementById('hlPopup');
    if(!popup.contains(e.target)) popup.classList.remove('show');
});

function applyHighlight(colorClass){
    const popup = document.getElementById('hlPopup');
    popup.classList.remove('show');

    if(!savedRange) return;

    // 기존 하이라이트 제거 (지우기 또는 재적용)
    removeHighlightInRange(savedRange);

    if(colorClass){
        // 새 하이라이트 span 씌우기
        const span = document.createElement('span');
        span.className = colorClass;
        try{
            savedRange.surroundContents(span);
        } catch(e){
            // 범위가 여러 노드에 걸친 경우 extractContents 사용
            const frag = savedRange.extractContents();
            span.appendChild(frag);
            savedRange.insertNode(span);
        }
    }

    // textarea에 현재 HTML 저장
    syncTextareaFromDisplay();
    window.getSelection().removeAllRanges();
    savedRange = null;
}

function removeHighlightInRange(range){
    const display = document.getElementById('cardTextDisplay');
    const spans = display.querySelectorAll('.hl-yellow,.hl-green,.hl-pink');
    spans.forEach(span=>{
        if(range.intersectsNode(span)){
            // span 해제: 텍스트 노드로 교체
            const parent = span.parentNode;
            while(span.firstChild) parent.insertBefore(span.firstChild, span);
            parent.removeChild(span);
        }
    });
}

// display HTML → textarea (저장용)
function syncTextareaFromDisplay(){
    const display = document.getElementById('cardTextDisplay');
    document.getElementById('cardText').value = display.innerHTML;
}

// ─── loadCardPreview 오버라이드: display에 렌더링 ───
const _origLoadCardPreview = loadCardPreview;
window.loadCardPreview = async function(){
    const bookId   = document.getElementById("cardBook").value;
    const chapter  = document.getElementById("cardChapter").value;
    const isWhole  = document.getElementById("wholeChapter").checked;
    const start    = parseInt(document.getElementById("startVerse").value);
    const end      = parseInt(document.getElementById("endVerse").value);
    const display  = document.getElementById('cardTextDisplay');

    if(!isWhole&&(!start||!end)){showToast("시작 절과 끝 절을 입력해 주세요.");return;}
    if(!isWhole&&start>end){showToast("시작 절이 끝 절보다 클 수 없어요.");return;}

    display.innerHTML='<span style="color:var(--ink-faint);font-size:0.85rem;">불러오는 중...</span>';

    try{
        const data = await getBibleData(bookId);
        let verses = [];
        if(data.chapters&&Array.isArray(data.chapters)){
            const tgt=data.chapters.find(c=>c.chapter==chapter);
            if(tgt&&tgt.verses) verses=isWhole?tgt.verses:tgt.verses.filter(v=>v.verse>=start&&v.verse<=end);
        } else if(Array.isArray(data)){
            verses=isWhole?data.filter(v=>v.chapter==chapter):data.filter(v=>v.chapter==chapter&&v.verse>=start&&v.verse<=end);
        }
        if(verses.length===0){display.innerHTML='';showToast("해당 범위의 말씀을 찾을 수 없어요.");return;}

        // plain text로 display에 렌더 (하이라이트 없이 시작)
        const plainText = verses.map(v=>`${v.verse}절  ${v.text}`).join('\n');
        // 텍스트를 HTML로 안전하게 변환
        display.innerHTML = plainText.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
        syncTextareaFromDisplay();
    } catch(err){
        display.innerHTML='';
        showToast(`오류: ${err.message}`);
    }
};

// ─── saveWordCard 오버라이드: display HTML을 저장 ───
const _origSaveWordCard = saveWordCard;
window.saveWordCard = function(){
    syncTextareaFromDisplay();
    _origSaveWordCard();
    // 저장 후 display 초기화
    document.getElementById('cardTextDisplay').innerHTML='';
};

// ─── 보관함 카드 본문 렌더링: HTML 지원 ───
// renderCards 내 word-card-text 부분이 innerHTML로 렌더되므로 하이라이트 자동 표시
// (기존 renderCards의 ${c.text}가 innerHTML로 들어가야 함)
const _origRenderCards = renderCards;
window.renderCards = function(){
    _origRenderCards();
    // word-card-text 요소들: c.text가 HTML이면 innerHTML로 재설정
    const cards = getSavedCards();
    cards.forEach((c,i)=>{
        const textDiv = document.getElementById('wct-'+i);
        if(textDiv && c.text && c.text.includes('<')) textDiv.innerHTML = c.text;
    });
};
</script>
